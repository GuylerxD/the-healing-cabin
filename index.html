    <link

    />
    <link rel="apple-touch-icon" href="/the-healing-cabin/icon-192.png" />
    <link rel="manifest" href="/the-healing-cabin/manifest.json" />
    <meta name="theme-color" content="#130d26" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/the-healing-cabin/sw.js")
            .then((reg) =>
              console.log("SW registered successfully:", reg.scope),
            )
            .catch((err) => console.log("SW registration failed:", err));
        });
      }
    </script>
  </body>
